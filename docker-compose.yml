services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ultranews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SECRET_KEY=insecure-dev-key-change-in-prod
      - DEBUG=1
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ultranews
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_API_KEY=dev-admin-key-change-in-prod
      - NEXTJS_URL=http://frontend:3000
      - SITE_URL=http://localhost:3000
      - REVALIDATE_SECRET=dev-revalidate-secret-change-in-prod
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Local dev talks to the app directly, so X-Forwarded-For must not be
      # trusted. Enable only behind a proxy that overwrites the header.
      - TRUST_PROXY_HEADERS=0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  worker-fetch:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q fetch,celery --concurrency=4
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SECRET_KEY=insecure-dev-key-change-in-prod
      - DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ultranews
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ADMIN_API_KEY=dev-admin-key-change-in-prod
      - NEXTJS_URL=http://frontend:3000
      - SITE_URL=http://localhost:3000
      - REVALIDATE_SECRET=dev-revalidate-secret-change-in-prod
      - LLM_API_KEY=${LLM_API_KEY:-}

  worker-cluster:
    build:
      context: ./backend
    command: celery -A config worker -l info -Q cluster --concurrency=1
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SECRET_KEY=insecure-dev-key-change-in-prod
      - DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ultranews
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ADMIN_API_KEY=dev-admin-key-change-in-prod
      - NEXTJS_URL=http://frontend:3000
      - SITE_URL=http://localhost:3000
      - REVALIDATE_SECRET=dev-revalidate-secret-change-in-prod
      - LLM_API_KEY=${LLM_API_KEY:-}

  beat:
    build:
      context: ./backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SECRET_KEY=insecure-dev-key-change-in-prod
      - DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ultranews
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ADMIN_API_KEY=dev-admin-key-change-in-prod
      - NEXTJS_URL=http://frontend:3000
      - SITE_URL=http://localhost:3000
      - REVALIDATE_SECRET=dev-revalidate-secret-change-in-prod
      - LLM_API_KEY=${LLM_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      # The Dockerfile is multi-stage; compose runs the dev target with hot
      # reload. Production builds target `runner`.
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # Must match the backend's REVALIDATE_SECRET for on-demand purges to work.
      - REVALIDATE_SECRET=dev-revalidate-secret-change-in-prod

volumes:
  postgres_data:
  redis_data:
