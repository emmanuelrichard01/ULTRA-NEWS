[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py

# Migrations MUST run. Parts of the schema exist only as migrations, not as
# model state:
#   - 0006 installs the pgvector extension. Without it no vector(384) column can
#     be created, so with --nomigrations every single test errored during table
#     setup — the suite had never been runnable.
#   - 0013 installs the search_vector trigger. Without it full-text search
#     returns nothing and no test could catch the regression.
# --reuse-db keeps this cheap after the first run; pass --create-db to rebuild.
addopts = --reuse-db
