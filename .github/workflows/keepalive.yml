name: Keepalive — keep the free instance warm

# Koyeb's Free Instance scales to zero after 1 hour with no traffic, and that
# threshold is not configurable on the free tier. Waking costs a container start
# plus an ~11 s embedding-model load on 0.1 vCPU, so a visitor arriving cold
# waits a minute or more — which for a portfolio deployment is the whole ball
# game. Someone clicks the link once; it needs to be up.
#
# This is ordinary HTTP traffic to a public health endpoint, not a workaround:
# the service really is meant to be reachable.
#
# DO NOT RELY ON THIS ALONE. The cron says every 15 minutes; GitHub delivers it
# every 27-75 minutes during the day and has gone 138 minutes overnight, because
# scheduled workflows are best-effort and deprioritised under load. Measured
# against a 60-minute idle window that is not a margin, it is a coin toss — the
# instance sleeps, and this workflow arrives late and becomes the cold start it
# was supposed to prevent.
#
# Put an external uptime monitor on /api/v1/health/live at a 5-minute interval
# and treat this as a backstop. An external monitor fires on time and alerts
# someone; this cannot do either.
#
# Delete this workflow if you move to a paid instance — it stops being useful
# the moment scale-to-zero is off.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL secret not set — skipping."
            exit 0
          fi

          # Three attempts, because the first request to a sleeping instance is
          # the one that wakes it and frequently does not survive the wake: Koyeb
          # answers with a gateway error while the container starts, and this
          # workflow used to record that as a failure and give up — having
          # triggered a cold start without confirming it finished.
          #
          # --max-time generously: a cold start legitimately takes a while, and
          # this request is what pays for it so a real visitor does not.
          status=000
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 \
              "$API_URL/api/v1/health/live" || echo "000")
            echo "attempt $attempt: HTTP $status"

            # 503 means the app is up and honestly reporting a degraded pipeline
            # — that is a data problem for the pipeline workflow to surface, not
            # a reason to fail the keepalive. Only a dead endpoint matters here.
            case "$status" in
              200|503) exit 0 ;;
            esac

            [ "$attempt" -lt 3 ] && sleep 30
          done

          echo "::warning::API unreachable after 3 attempts (HTTP $status)"
          exit 1
